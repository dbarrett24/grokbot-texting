name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    # Approved users only (Dave, CoS, Coding, EL all post as dbarrett24).
    # Actor must be dbarrett24 AND the comment/review/issue author must be the repo OWNER.
    if: >-
      github.actor == 'dbarrett24' && (
        (github.event_name == 'issue_comment' &&
          github.event.comment.author_association == 'OWNER' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
          github.event.comment.author_association == 'OWNER' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
          github.event.review.author_association == 'OWNER' &&
          contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' &&
          github.event.issue.author_association == 'OWNER' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # allowed_bots intentionally left empty: no bot may trigger this workflow.
          additional_permissions: |
            actions: read
